# Netlify Configuration File
# Portfolio Website for Dheeraj Bhardwaj | Data Analyst & Data Scientist

[build]
  # Static HTML/CSS/JS website - publish root directory
  publish = "."

# Custom headers for security & caching performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets (images, css, js) for optimal loading performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
